services:
  resume-analyzer:
    build: .
    container_name: resume-analyzer
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini} # default to gpt-4o-mini if not set
    volumes:
      - ./index.html:/app/index.html
      - ./JD.txt:/app/JD.txt
      - ./resume.pdf:/app/resume.pdf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
