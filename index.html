<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Resume Analyzer Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f5f7fb;
        color: #182033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(840px, calc(100vw - 32px));
        background: #ffffff;
        border: 1px solid #d9e0ea;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 12px 36px rgba(24, 32, 51, 0.08);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #536078;
        line-height: 1.5;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: grid;
        gap: 8px;
        font-weight: 700;
      }

      input[type="file"] {
        padding: 14px;
        border: 1px dashed #8ea0bd;
        border-radius: 8px;
        background: #fbfcff;
      }

      button {
        width: fit-content;
        border: 0;
        border-radius: 6px;
        padding: 12px 18px;
        color: #ffffff;
        background: #1967d2;
        font-weight: 700;
        cursor: pointer;
        margin-right: 8px;
      }

      button.secondary {
        background: #34a853;
      }

      button.secondary:hover {
        background: #2d8e47;
      }

      button:hover {
        background: #1557b0;
      }

      button#download-button {
        display: none;
      }

      button#download-button.visible {
        display: inline-block;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }

      pre {
        min-height: 240px;
        margin: 24px 0 0;
        padding: 18px;
        overflow: auto;
        border-radius: 8px;
        background: #111827;
        color: #e5f3ff;
        line-height: 1.45;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AI Resume Analyzer</h1>
      <p>Upload a resume PDF and paste the job description. The backend extracts resume text, compares it with the job description, and returns a JSON match report.</p>

      <form id="resume-form">
        <label>
          Job Description
          <textarea id="job-description" name="job_description_text" required style="padding: 8px; border: 1px solid #d9e0ea; border-radius: 4px; font-family: monospace; min-height: 120px;"></textarea>
        </label>
        <label>
          Resume PDF
          <input id="resume" name="resume" type="file" accept="application/pdf,.pdf" required />
        </label>
        <div style="display: flex; gap: 8px;">
          <button id="submit-button" type="submit">Analyze Resume</button>
          <button id="download-button" class="secondary" type="button">Download JSON</button>
        </div>
      </form>

      <pre id="output">JSON output will appear here.</pre>
    </main>

    <script>
      const form = document.querySelector("#resume-form");
      const button = document.querySelector("#submit-button");
      const downloadButton = document.querySelector("#download-button");
      const output = document.querySelector("#output");
      let currentResult = null;

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const file = document.querySelector("#resume").files[0];
        const jobDescription = document.querySelector("#job-description").value;
        if (!file || !jobDescription) return;

        const body = new FormData();
        body.append("resume", file);
        body.append("job_description_text", jobDescription);

        button.disabled = true;
        downloadButton.classList.remove("visible");
        output.textContent = "Analyzing...";

        try {
          const response = await fetch("/analyze", {
            method: "POST",
            body,
          });
          const result = await response.json();
          currentResult = result;
          output.textContent = JSON.stringify(result, null, 2);
          downloadButton.classList.add("visible");
        } catch (error) {
          currentResult = null;
          downloadButton.classList.remove("visible");
          output.textContent = JSON.stringify(
            { error: "Request failed", detail: error.message },
            null,
            2
          );
        } finally {
          button.disabled = false;
        }
      });

      downloadButton.addEventListener("click", () => {
        if (!currentResult) return;
        
        const timestamp = new Date().toISOString().split('T')[0];
        const filename = `resume-analysis-${timestamp}.json`;
        const dataStr = JSON.stringify(currentResult, null, 2);
        const dataBlob = new Blob([dataStr], { type: "application/json" });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
